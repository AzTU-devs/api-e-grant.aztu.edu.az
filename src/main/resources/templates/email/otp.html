<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Verification code</title></head>
<body style="font-family: Arial, sans-serif; color: #222; line-height: 1.5;">
<h2 style="color:#0b5394;">Your verification code</h2>
<p>Hello <span th:text="${name}">Researcher</span>,</p>
<p>Use the following one-time code to continue:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px; color:#0b5394;"
   th:text="${code}">000000</p>
<p>This code expires shortly. If you did not request it, you can ignore this message.</p>
<p>Best regards,<br/>AZTU E-Grant Team</p>
</body>
</html>
