spring.application.name=egrant
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Datasource ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/egrant}
spring.datasource.username=${DATABASE_USERNAME:egrant}
spring.datasource.password=${DATABASE_PASSWORD:egrant}

# --- JPA / Hibernate (Flyway owns the schema; NEVER use update/create) ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Mail ---
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# --- Async task executor ---
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8

# --- Server ---
server.port=${PORT:8080}
server.error.include-message=always

# --- Application config ---
egrant.jwt.secret=${JWT_SECRET:change-me-in-prod-this-is-a-very-long-development-only-secret-key-0123456789}
egrant.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT1H}
egrant.jwt.otp-token-ttl=${JWT_OTP_TTL:PT1H}
egrant.otp.ttl=${OTP_TTL:PT5M}
egrant.otp.length=6
egrant.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
egrant.storage.local.base-dir=${STORAGE_BASE_DIR:./var/storage}
egrant.mail.from=${MAIL_FROM:no-reply@e-grant.aztu.edu.az}
egrant.mail.enabled=${MAIL_ENABLED:true}
egrant.ratelimit.enabled=${RATELIMIT_ENABLED:true}
egrant.ratelimit.per-day=${RATELIMIT_PER_DAY:200}
egrant.ratelimit.per-hour=${RATELIMIT_PER_HOUR:50}

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
