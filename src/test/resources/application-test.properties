# Datasource is provided by Testcontainers @ServiceConnection.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

egrant.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-0123456789abcdef
egrant.jwt.access-token-ttl=PT1H
egrant.jwt.otp-token-ttl=PT1H
egrant.otp.ttl=PT5M
egrant.otp.length=6
egrant.cors.allowed-origins=*
egrant.storage.local.base-dir=${java.io.tmpdir}/egrant-test-storage
egrant.mail.enabled=false
egrant.ratelimit.enabled=false

logging.level.org.springframework.modulith=INFO
